# Konfigurasi Supabase CLI untuk Proyek Caturan
# Dokumentasi referensi: https://supabase.com/docs/guides/cli/config

project_id = "caturan"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Registrasi publik dinonaktifkan (Caturan hanya untuk pemilik proyek)
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Provider login email & password tetap aktif untuk pemilik (registrasi publik sudah diblokir oleh [auth] enable_signup = false)
enabled = true
double_confirm_changes = true
enable_confirmations = true
